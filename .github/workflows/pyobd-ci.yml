name: pyobd ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-24.04 ]
        python-version: [ "3.12", "3.13" ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyPI has no Linux wheels for wxPython, and building it from source
      # takes close to an hour, so use the prebuilt wheels from wxpython.org.
      - name: Install wxPython (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libsdl2-2.0-0 libnotify4 libsm6 libxtst6
          pip install --only-binary wxPython -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/ wxPython

      - name: Install requirements
        run: pip install -r requirements-dev.txt

      - name: Check every file compiles
        run: python -m compileall -q pyobd.py obd_io.py obd_sensors.py obd2_codes.py debugEvent.py obd

      - name: Run tests
        run: python -m unittest discover -v -s tests -t .
