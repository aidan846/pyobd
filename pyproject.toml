[project]
name = "pyobd2"
version = "1.20"
description = "An OBD-II car diagnostic tool for ELM327 adapters (USB, Bluetooth and WiFi). A maintained, updated version of pyOBD for current macOS, Windows and Linux."
authors = [
    { name = "Aidan (aidan846)" },
    { name = "Jure Poljsak (barracuda-fsh)" },
    { name = "Charles Donour Sizemore" },
]
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.10"
dependencies = [
    "wxPython>=4.2.2",
    "pyserial>=3.5",
    "numpy>=1.26",
    "Pint>=0.20",
]

[project.urls]
Homepage = "https://github.com/aidan846/pyobd"
Issues = "https://github.com/aidan846/pyobd/issues"
"Original project" = "https://github.com/barracuda-fsh/pyobd"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
